    <!-- Before styles.css arrives (scripts bring it): the theme's background, not the window's, and the view
         transition that keeps the old picture while the app reloads the page (src/ui/reload.ts). -->
    <style>
      html { background: #fafafb; color-scheme: light; }
      @media (prefers-color-scheme: dark) { html { background: #0b0c0f; color-scheme: dark; } }
      @view-transition { navigation: auto; }
      ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 120ms; }
    </style>
    <!-- Deferred like any module script; in the head, the page is not drawn before the app is. -->
    <script type="module" blocking="render" src="./main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
