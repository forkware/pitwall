# Contributions come under CLA.md; this checks that each author of a pull request accepted it.
# Only in the upstream repository: CI runs in every fork, and a fork has no one to sign for.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write # the signatures are kept on the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.repository == 'forkware/pitwall' &&
      (github.event_name == 'pull_request_target' ||
       github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/forkware/pitwall/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: Nebotov,github-actions[bot],dependabot[bot]
